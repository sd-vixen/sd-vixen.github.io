<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Gallery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the active tab indicator */
        .tab-button.active {
            position: relative;
            color: #1c64f2; /* Blue text for active tab */
            background-color: #e0e7ff; /* Light blue background for active tab */
            font-weight: 600; /* Bolder font for active tab */
        }
        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -2px; /* Position the line at the bottom of the button */
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #1c64f2; /* Blue line color */
            border-radius: 9999px; /* Rounded ends for the line */
        }
        /* Hide content that is not the active tab */
        .tab-content {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased">

    <!-- Main Container -->
    <div class="min-h-screen p-4 sm:p-8 flex flex-col items-center">

        <!-- Header -->
        <header class="w-full max-w-7xl mx-auto text-center mb-8">
            <h1 class="text-4xl sm:text-5xl font-bold text-gray-900 leading-tight">
                Model Gallery Showcase
            </h1>
            <p class="mt-4 text-lg text-gray-600">
                Explore different models by clicking on the tabs below.
            </p>
        </header>

        <!-- Tabs Container -->
        <div class="w-full max-w-7xl mx-auto bg-white rounded-lg shadow-lg p-6">
            <!-- Tab Buttons -->
            <div class="flex border-b border-gray-200 justify-center sm:justify-start -mt-2">
                <button id="tab-model1" class="tab-button active px-4 py-3 sm:px-6 text-sm sm:text-base font-medium text-gray-600 hover:text-blue-600 transition-colors duration-200">
                    Model 1
                </button>
                <button id="tab-model2" class="tab-button px-4 py-3 sm:px-6 text-sm sm:text-base font-medium text-gray-600 hover:text-blue-600 transition-colors duration-200">
                    Model 2
                </button>
                <button id="tab-model3" class="tab-button px-4 py-3 sm:px-6 text-sm sm:text-base font-medium text-gray-600 hover:text-blue-600 transition-colors duration-200">
                    Model 3
                </button>
                <button id="tab-model4" class="tab-button px-4 py-3 sm:px-6 text-sm sm:text-base font-medium text-gray-600 hover:text-blue-600 transition-colors duration-200">
                    Model 4
                </button>
            </div>

            <!-- Tab Content -->
            <div class="p-4 sm:p-6 mt-4">
                <!-- Model 1 Gallery (Visible by default) -->
                <div id="content-model1" class="tab-content">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <!-- Replace these with your own images -->
                        <img src="https://placehold.co/600x400/1c64f2/FFFFFF?text=Model+1+Image+1" alt="Model 1 Image 1" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="https://placehold.co/600x400/1c64f2/FFFFFF?text=Model+1+Image+2" alt="Model 1 Image 2" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="https://placehold.co/600x400/1c64f2/FFFFFF?text=Model+1+Image+3" alt="Model 1 Image 3" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="https://placehold.co/600x400/1c64f2/FFFFFF?text=Model+1+Image+4" alt="Model 1 Image 4" class="w-full h-48 object-cover rounded-lg shadow-md">
                    </div>
                </div>

                <!-- Model 2 Gallery -->
                <div id="content-model2" class="tab-content">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <!-- Replace these with your own images -->
                        <img src="https://placehold.co/600x400/38a169/FFFFFF?text=Model+2+Image+1" alt="Model 2 Image 1" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="https://placehold.co/600x400/38a169/FFFFFF?text=Model+2+Image+2" alt="Model 2 Image 2" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="https://placehold.co/600x400/38a169/FFFFFF?text=Model+2+Image+3" alt="Model 2 Image 3" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="https://placehold.co/600x400/38a169/FFFFFF?text=Model+2+Image+4" alt="Model 2 Image 4" class="w-full h-48 object-cover rounded-lg shadow-md">
                    </div>
                </div>

                <!-- Model 3 Gallery -->
                <div id="content-model3" class="tab-content">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <!-- Replace these with your own images -->
                        <img src="https://placehold.co/600x400/d69e2e/FFFFFF?text=Model+3+Image+1" alt="Model 3 Image 1" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="https://placehold.co/600x400/d69e2e/FFFFFF?text=Model+3+Image+2" alt="Model 3 Image 2" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="https://placehold.co/600x400/d69e2e/FFFFFF?text=Model+3+Image+3" alt="Model 3 Image 3" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="https://placehold.co/600x400/d69e2e/FFFFFF?text=Model+3+Image+4" alt="Model 3 Image 4" class="w-full h-48 object-cover rounded-lg shadow-md">
                    </div>
                </div>

                <!-- Model 4 Gallery -->
                <div id="content-model4" class="tab-content">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <!-- Replace these with your own images -->
                        <img src="https://placehold.co/600x400/e53e3e/FFFFFF?text=Model+4+Image+1" alt="Model 4 Image 1" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="https://placehold.co/600x400/e53e3e/FFFFFF?text=Model+4+Image+2" alt="Model 4 Image 2" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="https://placehold.co/600x400/e53e3e/FFFFFF?text=Model+4+Image+3" alt="Model 4 Image 3" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="https://placehold.co/600x400/e53e3e/FFFFFF?text=Model+4+Image+4" alt="Model 4 Image 4" class="w-full h-48 object-cover rounded-lg shadow-md">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Get all tab buttons and tab content sections
            const tabs = document.querySelectorAll('.tab-button');
            const contents = document.querySelectorAll('.tab-content');

            // Find the initially active tab and display its content
            const initialTabId = document.querySelector('.tab-button.active').id;
            const initialContentId = 'content-' + initialTabId.split('-')[1];
            document.getElementById(initialContentId).style.display = 'block';

            // Add a click event listener to each tab button
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Remove 'active' class from all tabs and hide all content
                    tabs.forEach(t => t.classList.remove('active'));
                    contents.forEach(c => c.style.display = 'none');

                    // Add 'active' class to the clicked tab
                    tab.classList.add('active');

                    // Get the ID of the content to display
                    const contentId = 'content-' + tab.id.split('-')[1];

                    // Display the corresponding content
                    document.getElementById(contentId).style.display = 'block';
                });
            });
        });
    </script>
</body>
</html>
