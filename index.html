<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Gallery</title>
    <!-- Link to Tailwind CSS CDN for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link to your custom stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased">

    <!-- Main Container -->
    <div class="min-h-screen p-4 sm:p-8 flex flex-col items-center">

        <!-- Header -->
        <header class="w-full max-w-7xl mx-auto text-center mb-8">
            <h1 class="text-4xl sm:text-5xl font-bold text-gray-900 leading-tight">
                Model Gallery Showcase
            </h1>
            <p class="mt-4 text-lg text-gray-600">
                Explore different models by clicking on the tabs below.
            </p>
        </header>

        <!-- Tabs Container -->
        <div class="w-full max-w-7xl mx-auto bg-white rounded-lg shadow-lg p-6">
            <!-- Tab Buttons -->
            <div class="flex border-b border-gray-200 flex-wrap justify-center sm:justify-start -mt-2">
                <button id="tab-model1" class="tab-button active px-4 py-3 sm:px-6 text-sm sm:text-base font-medium text-gray-600 hover:text-blue-600 transition-colors duration-200">
                    Model 1
                </button>
                <button id="tab-model2" class="tab-button px-4 py-3 sm:px-6 text-sm sm:text-base font-medium text-gray-600 hover:text-blue-600 transition-colors duration-200">
                    Model 2
                </button>
                <button id="tab-model3" class="tab-button px-4 py-3 sm:px-6 text-sm sm:text-base font-medium text-gray-600 hover:text-blue-600 transition-colors duration-200">
                    Model 3
                </button>
                <button id="tab-model4" class="tab-button px-4 py-3 sm:px-6 text-sm sm:text-base font-medium text-gray-600 hover:text-blue-600 transition-colors duration-200">
                    Model 4
                </button>
                <button id="tab-model5" class="tab-button px-4 py-3 sm:px-6 text-sm sm:text-base font-medium text-gray-600 hover:text-blue-600 transition-colors duration-200">
                    Model 5
                </button>
                <button id="tab-model6" class="tab-button px-4 py-3 sm:px-6 text-sm sm:text-base font-medium text-gray-600 hover:text-blue-600 transition-colors duration-200">
                    Model 6
                </button>
                <button id="tab-model7" class="tab-button px-4 py-3 sm:px-6 text-sm sm:text-base font-medium text-gray-600 hover:text-blue-600 transition-colors duration-200">
                    Model 7
                </button>
                <button id="tab-model8" class="tab-button px-4 py-3 sm:px-6 text-sm sm:text-base font-medium text-gray-600 hover:text-blue-600 transition-colors duration-200">
                    Model 8
                </button>
            </div>

            <!-- Tab Content -->
            <div class="p-4 sm:p-6 mt-4">
                <!-- Model 1 Gallery (Visible by default) -->
                <div id="content-model1" class="tab-content">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <!-- Images for Model 1 -->
                        <img src="images/model1/image1.jpg" alt="Model 1 Image 1" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model1/image2.jpg" alt="Model 1 Image 2" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model1/image3.jpg" alt="Model 1 Image 3" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model1/image4.jpg" alt="Model 1 Image 4" class="w-full h-48 object-cover rounded-lg shadow-md">
                    </div>
                </div>

                <!-- Model 2 Gallery -->
                <div id="content-model2" class="tab-content">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <!-- Images for Model 2 -->
                        <img src="images/model2/image1.jpg" alt="Model 2 Image 1" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model2/image2.jpg" alt="Model 2 Image 2" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model2/image3.jpg" alt="Model 2 Image 3" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model2/image4.jpg" alt="Model 2 Image 4" class="w-full h-48 object-cover rounded-lg shadow-md">
                    </div>
                </div>

                <!-- Model 3 Gallery -->
                <div id="content-model3" class="tab-content">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <!-- Images for Model 3 -->
                        <img src="images/model3/image1.jpg" alt="Model 3 Image 1" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model3/image2.jpg" alt="Model 3 Image 2" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model3/image3.jpg" alt="Model 3 Image 3" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model3/image4.jpg" alt="Model 3 Image 4" class="w-full h-48 object-cover rounded-lg shadow-md">
                    </div>
                </div>

                <!-- Model 4 Gallery -->
                <div id="content-model4" class="tab-content">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <!-- Images for Model 4 -->
                        <img src="images/model4/image1.jpg" alt="Model 4 Image 1" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model4/image2.jpg" alt="Model 4 Image 2" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model4/image3.jpg" alt="Model 4 Image 3" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model4/image4.jpg" alt="Model 4 Image 4" class="w-full h-48 object-cover rounded-lg shadow-md">
                    </div>
                </div>

                <!-- Model 5 Gallery -->
                <div id="content-model5" class="tab-content">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <!-- Images for Model 5 -->
                        <img src="images/model5/image1.jpg" alt="Model 5 Image 1" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model5/image2.jpg" alt="Model 5 Image 2" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model5/image3.jpg" alt="Model 5 Image 3" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model5/image4.jpg" alt="Model 5 Image 4" class="w-full h-48 object-cover rounded-lg shadow-md">
                    </div>
                </div>

                <!-- Model 6 Gallery -->
                <div id="content-model6" class="tab-content">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <!-- Images for Model 6 -->
                        <img src="images/model6/image1.jpg" alt="Model 6 Image 1" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model6/image2.jpg" alt="Model 6 Image 2" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model6/image3.jpg" alt="Model 6 Image 3" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model6/image4.jpg" alt="Model 6 Image 4" class="w-full h-48 object-cover rounded-lg shadow-md">
                    </div>
                </div>

                <!-- Model 7 Gallery -->
                <div id="content-model7" class="tab-content">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <!-- Images for Model 7 -->
                        <img src="images/model7/image1.jpg" alt="Model 7 Image 1" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model7/image2.jpg" alt="Model 7 Image 2" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model7/image3.jpg" alt="Model 7 Image 3" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model7/image4.jpg" alt="Model 7 Image 4" class="w-full h-48 object-cover rounded-lg shadow-md">
                    </div>
                </div>

                <!-- Model 8 Gallery -->
                <div id="content-model8" class="tab-content">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                        <!-- Images for Model 8 -->
                        <img src="images/model8/image1.jpg" alt="Model 8 Image 1" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model8/image2.jpg" alt="Model 8 Image 2" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model8/image3.jpg" alt="Model 8 Image 3" class="w-full h-48 object-cover rounded-lg shadow-md">
                        <img src="images/model8/image4.jpg" alt="Model 8 Image 4" class="w-full h-48 object-cover rounded-lg shadow-md">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Link to your custom JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
